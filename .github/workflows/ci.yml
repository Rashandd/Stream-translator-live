name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # sdk/src-tauri is a workspace member, so any workspace-wide cargo
      # command needs Tauri's Linux build deps too (see docs/sdk-distribution.md).
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo clippy --workspace -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  sdk-macos-build-check:
    name: SDK macOS build check (informational)
    runs-on: macos-latest
    # Real-device audio capture on macOS has never been verified (see
    # docs/sdk-distribution.md) and this repo has no darwin CI history —
    # informational only until that changes. Catches compile breaks on PRs
    # instead of waiting for the sdk-release tag build to find them.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo check -p streamdubber-sdk (macOS)
        run: cargo check -p streamdubber-sdk --all-targets

  frontend:
    name: Frontend (lint + test + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npx tsc --noEmit

  stt-server:
    name: STT server (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stt-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # faster-whisper hiç import edilmez (testler main.engine'i bir
      # FakeEngine'le değiştirir, GPU/model indirme gerekmez) — yine de
      # bağımlılık grafiği gerçek prod imajıyla aynı kalsın diye
      # requirements.txt'ten kurulur.
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -v
