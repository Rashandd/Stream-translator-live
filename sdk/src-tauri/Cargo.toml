[package]
name = "streamdubber-sdk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "../src/lib.rs"

[[bin]]
name = "streamdubber-sdk"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
reqwest.workspace = true
sha2.workspace = true
hex.workspace = true
hmac.workspace = true
base64.workspace = true
aes-gcm.workspace = true
getrandom.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"

# Windows WASAPI cihaz I/O (1.3) — yalnız Windows build'ine girer.
[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.23"

# macOS/Linux cihaz I/O (1.3) — cpal, CoreAudio/ALSA/PulseAudio/JACK'ı tek
# API arkasında kapsayan olgun bir crate; macOS kodu bu repoda hiç derleme
# kontrolünden geçemediği için (darwin target/SDK yok) hand-rolled FFI'den
# daha güvenli — bkz. docs/audio-pipeline.md.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
cpal = "0.15"

[dev-dependencies]
streamdubber-backend = { path = "../../backend" }
axum.workspace = true

# Integration tests live under sdk/tests (src lives under sdk/src, crate is here).
[[test]]
name = "cloud_e2e"
path = "../tests/cloud_e2e.rs"

[[test]]
name = "relay_wiring"
path = "../tests/relay_wiring.rs"

[[test]]
name = "stt_control_wiring"
path = "../tests/stt_control_wiring.rs"

[[test]]
name = "stt_control_loop"
path = "../tests/stt_control_loop.rs"

[[test]]
name = "cloud_session_wiring"
path = "../tests/cloud_session_wiring.rs"
