# StreamDubber — local dev ortamı.
# Tüm servisler .env'den konfigüre edilir; image içine değer gömülmez.
# Kullanım: docker compose -f infra/docker-compose.yml --env-file .env up

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      # .env yoksa da compose çalışır (JWT_SECRET vb. environment'tan/panelden).
      - path: ../.env
        required: false
    environment:
      BIND_ADDR: 0.0.0.0:8080
      # Panelden girilen secret'lar + loglar + kullanım sayaçları volume'da
      # kalıcı (restart'a dayanır).
      SECRETS_FILE: /data/secrets.enc
      LOG_FILE: /data/logs.jsonl
      USAGE_FILE: /data/usage.jsonl
      TOKENS_FILE: /data/tokens.enc
      RELAY_FILE: /data/relay.enc
      SDK_SESSIONS_FILE: /data/sdk-sessions.enc
      STT_SETTINGS_FILE: /data/stt-settings.json
      STT_SERVERS_FILE: /data/stt-servers.enc
      USERS_FILE: /data/users.enc
      FOUNDING_APPS_FILE: /data/founding-apps.json
    volumes:
      - sddata:/data
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_started
    healthcheck:
      test: ["CMD", "/usr/local/bin/streamdubber-backend", "--health-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Tarayıcıya gömülür — build anında verilir (runtime env yetmez).
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_OVERLAY_WS_URL: ws://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: streamdubber
      POSTGRES_PASSWORD: streamdubber
      POSTGRES_DB: streamdubber
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamdubber"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:1.17
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    command: server -dev
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  sddata:
